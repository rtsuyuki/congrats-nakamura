<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>sign — 中村駿吾さん ご栄転の寄せ書き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@300;400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15141B;--panel:#1C1B24;--line:#332F3E;
  --amber:#E8A33D;--amber-dim:#8A6528;
  --text:#DBD5C7;--muted:#7E7789;--user:#8FA6D8;--ok:#7FB88A;--seal:#C0453B;
  --mono:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace;
  --mincho:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-weight:300;
  font-size:13.5px;line-height:1.85;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.013) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
#scroll{flex:1;overflow-y:auto;padding:26px 22px 8px}
#scroll::-webkit-scrollbar{width:8px}
#scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.inner{max-width:880px;margin:0 auto}
/* ウェルカムボックス */
.wbox{position:relative;border:1px solid var(--amber-dim);border-radius:7px;
  display:grid;grid-template-columns:0.92fr 1.08fr;margin:12px 0 24px}
.wbox .legend{position:absolute;top:-.72em;left:18px;background:var(--bg);padding:0 9px;
  color:var(--amber);font-size:11.5px;font-weight:500;letter-spacing:.09em}
.wl{padding:22px 20px 20px;text-align:center;border-right:1px solid var(--amber-dim)}
.wr{padding:22px 22px 20px}
.hey{font-size:13.5px;color:#E4DED0}
.hey b{font-family:var(--mincho);font-weight:900;font-size:23px;letter-spacing:.06em;
  color:#F7F1E4;text-shadow:0 0 26px rgba(232,163,61,.32);vertical-align:-1px}
.mascot{margin:17px auto 16px;display:block}
.wl .meta{color:var(--muted);font-size:11.5px;line-height:1.8}
.wl .meta em{font-style:normal;color:var(--amber-dim)}
.wr h4{color:var(--amber);font-size:12.5px;font-weight:700;margin-bottom:3px}
.wr p{color:var(--text);font-size:12.5px;line-height:1.72;opacity:.9}
.wr p code{color:var(--amber);font-weight:500;font-family:var(--mono)}
.wr hr{border:0;border-top:1px solid var(--amber-dim);margin:13px 0}
.wr .it{font-style:italic;color:var(--muted);font-size:12px}
@media (max-width:720px){
  .wbox{grid-template-columns:1fr}
  .wl{border-right:0;border-bottom:1px solid var(--amber-dim)}
}
.row{margin:0 0 4px;white-space:pre-wrap;word-break:break-word}
.gap{height:14px}
.u{color:var(--user)}
.u::before{content:"> ";color:var(--muted)}
.a::before{content:"⏺ ";color:var(--amber)}
.tool{color:var(--muted);font-size:12.5px}
.tool::before{content:"⏺ ";color:var(--ok)}
.res{color:var(--muted);font-size:12.5px}
.res::before{content:"  ⎿  "}
.dim{color:var(--muted)}
.err{color:var(--seal)}
.hi{color:var(--amber)}
.draft{border-left:2px solid var(--amber-dim);padding:2px 0 2px 16px;margin:6px 0 4px 2px;line-height:2.0}
.out{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 15px;margin:10px 0 4px;
  font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.7}
.btn{background:none;border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--mono);
  font-size:12px;padding:8px 18px;border-radius:2px;cursor:pointer;letter-spacing:.08em;margin:6px 8px 0 0;
  transition:background .2s,color .2s}
.btn:hover{background:var(--amber);color:var(--bg)}
#dock{border-top:1px solid var(--line);padding:14px 22px 12px}
.dockin{max-width:880px;margin:0 auto}
.box{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 13px}
.box:focus-within{border-color:var(--amber-dim)}
.box .cr{color:var(--amber)}
#in{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--mono);
  font-size:13.5px;font-weight:300;resize:none;line-height:1.7;max-height:120px}
#in::placeholder{color:#55505F}
.hint{display:flex;justify-content:space-between;font-size:11px;color:#55505F;margin-top:7px}
@media (max-width:640px){#scroll{padding:18px 14px 6px}#dock{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scroll"><div class="inner" id="log"></div></div>
<div id="dock"><div class="dockin">
  <div class="box"><span class="cr">&gt;</span><textarea id="in" rows="1" placeholder="番号を入力してください"></textarea></div>
  <div class="hint"><span id="mode" class="dim">/help でコマンド一覧</span><span>Enter で1行確定</span></div>
</div></div>

<script>
/* ============ 書き手の名簿（ここだけ差し替え可） ============ */
const TO = "中村 駿吾";
const COLLECTOR = "露木";
const ROSTER = [
  {id:"komatsu",  who:"小松",    role:"キャリア採用 前任 ／ 中村さんへ引き継いだ人",
   draft:[
     "キャリア採用を引き継いだとき、正直まだ早いかもしれないと思っていました。",
     "でも気づいたら、私の知らない口説き方で候補者を惹きつけていましたね。",
     "新しい部署でも、あの粘り強さはそのまま通用します。おめでとう。"
   ]},
  {id:"tsuyuki",  who:"露木 諒", role:"人財開発課 ／ 研修生のときから今までの上司",
   draft:[
     "研修生だった頃の中村さんを、社内で一番よく覚えているのはたぶん私です。",
     "あの頃から、わからないことを「わかりません」と言えるのが強みでした。",
     "その素直さのまま人事になり、今回の異動につながりました。",
     "場所が変わっても、その一言だけは手放さないでください。"
   ]},
  {id:"tago",     who:"田子",    role:"新卒採用担当",
   draft:[
     "新卒とキャリアで担当は違ったのに、採用の相談にはいつも付き合ってくれましたね。",
     "席が離れても、たぶん私はまた相談しに行きます。そのときはよろしくお願いします。",
     "ご栄転、おめでとうございます。"
   ]},
  {id:"baba",     who:"馬場",    role:"後輩 ／ 8月から人事",
   draft:[
     "入れ替わるような形で、8月から人事に入ります。",
     "中村さんが積み上げてきたものを引き受けるのは、正直まだ荷が重いです。",
     "でも同じ会社にいてくれるので、遠慮なく頼らせてもらいます。"
   ]},
  {id:"ishimoto", who:"石本",    role:"教材開発 ／ Claude系講座を共同開発",
   draft:[
     "Claudeの講座を二人であれこれ試しながら作った時間が、一番楽しかったです。",
     "詰まったときの「とりあえず動かしてみましょう」が、いつも突破口でした。",
     "部署が変わっても、また何か一緒に作りましょう。"
   ]},
];
/* ========================================================== */

const $=s=>document.querySelector(s);
const log=$("#log"),scroll=$("#scroll"),input=$("#in");
let who=null, lines=[], stage="pick";

function line(t,c){const p=document.createElement("div");p.className="row "+(c||"");p.textContent=t;
  log.appendChild(p);scroll.scrollTop=scroll.scrollHeight;return p}
function html(h){const d=document.createElement("div");d.innerHTML=h;log.appendChild(d);
  scroll.scrollTop=scroll.scrollHeight;return d}
function gap(){const d=document.createElement("div");d.className="gap";log.appendChild(d)}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const PIX=[
  ".AAAAAAAAAAAA.","AAAAAAAAAAAAAA","AAAAAAAAAAAAAA","AAADDAAAADDAAA",
  "AAADDAAAADDAAA","AAAAAAAAAAAAAA","AAAADAAAADAAAA","AAAAADDDDAAAAA",
  "AAAAAAAAAAAAAA","AAAAAAAAAASSAA","AAAAAAAAAASSAA",".AAAAAAAAAAAA.",
];
function mascot(px){
  const w=PIX[0].length,h=PIX.length;
  let r='<svg class="mascot" width="'+w*px+'" height="'+h*px+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges">';
  const col={A:"var(--amber)",D:"var(--bg)",S:"var(--seal)"};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=PIX[y][x]; if(c===".")continue;
    r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+col[c]+'"/>';
  }
  return r+"</svg>";
}
html('<div class="wbox">'+
  '<span class="legend">congrats — sign v1.0.0</span>'+
  '<div class="wl">'+
    '<div class="hey"><b>'+esc(TO)+'</b> さんへ<br><span style="font-size:11.5px;color:var(--muted)">ご栄転のお祝いに</span></div>'+
    mascot(7)+
    '<div class="meta">'+ROSTER.length+' contributors · <em>2026.08</em><br>'+
      '~/congrats/messages</div>'+
  '</div>'+
  '<div class="wr">'+
    '<h4>書き方</h4>'+
    '<p>名前を選ぶと下書きが開きます。<br>'+
       'Enterで1行ずつ、<code>/done</code> で確定。</p>'+
    '<hr>'+
    '<h4>書き終わったら</h4>'+
    '<p>コピー用の1行が出ます。それを '+esc(COLLECTOR)+' に送ってください。</p>'+
    '<p class="it">/help ですべてのコマンド</p>'+
  '</div>'+
'</div>');
line("あなたはどなたですか。番号でどうぞ。","a");
gap();
ROSTER.forEach((r,i)=>line("  "+(i+1)+"  "+r.who+"　"+r.role,"dim"));
gap();

function startWrite(fresh){
  stage="write";
  lines = fresh ? [] : (who.draft ? who.draft.slice() : []);
  $("#mode").innerHTML='<span class="hi">書き込み中</span> <span class="dim">／ /done 確定 · /clear 全消し · /undo 1行消す · /reset 下書きに戻す</span>';
  input.placeholder="そのまま入力すると末尾に追記されます。/done で確定";
  if(lines.length){
    line("Read(messages/"+who.id+".md)","tool");
    line("下書きを "+lines.length+" 行 読み込みました","res");
    gap();
    preview();
    line(who.who+"さんですね。下書きを入れてあります。","a");
    line("このままでよければ /done。書き換えるなら /clear で全消し、末尾だけ削るなら /undo。","dim");
    line("入力した行はそのまま末尾に足されます。","dim");
  }else{
    line("Write(messages/"+who.id+".md)","tool");
    line("空のファイルを開きました","res");
    gap();
    line(who.who+"さんですね。"+TO+"さんへ、思うままにどうぞ。","a");
    line("Enterで1行ずつ書けます。書き終わったら /done。","dim");
  }
  gap();
}

function preview(){
  if(!lines.length){line("まだ何も書かれていません。","err");gap();return}
  html('<div class="row hi">'+esc(who.who)+' <span class="dim">'+esc(who.role)+'</span></div>'+
       '<div class="draft">'+esc(lines.join("\n"))+'</div>');
  gap();
}

function done(){
  if(!lines.length){line("本文が空です。1行でも書いてから /done してください。","err");gap();return}
  stage="done";
  const obj='{ id:"'+who.id+'", who:"'+who.who+'", role:"'+who.role+'", body:'+
            JSON.stringify(lines.join("\n"))+' },';
  line("Write(messages/"+who.id+".md)","tool");
  line("Wrote "+lines.length+" lines","res");
  gap();
  preview();
  line("確定しました。下の1行をコピーして、"+COLLECTOR+"に送ってください。","a");
  const box=html('<div class="out" id="out">'+esc(obj)+'</div>'+
    '<button class="btn" id="copy">コピーする</button>'+
    '<button class="btn" id="redo">書き直す</button>');
  box.querySelector("#copy").onclick=()=>{
    const b=box.querySelector("#copy");
    navigator.clipboard.writeText(obj).then(()=>{b.textContent="コピーしました";
      setTimeout(()=>b.textContent="コピーする",1800)})
      .catch(()=>{b.textContent="手動で選択してください"});
  };
  box.querySelector("#redo").onclick=()=>{startWrite(false)};
  gap();
  $("#mode").innerHTML='<span class="dim">完了しました。ありがとうございます。</span>';
  input.placeholder="/reset で書き直せます";
}

function submit(raw){
  const v=raw.replace(/\s+$/,"");
  if(!v.trim() && stage!=="write") return;

  if(v.trim().startsWith("/")){
    line(v,"u");
    const c=v.trim().slice(1).split(/\s+/)[0];
    if(c==="help"){
      gap();
      ["/done      書き終わって確定する","/clear     全部消して白紙から書く","/undo      末尾の1行を消す",
       "/reset     最初の下書きに戻す","/preview   ここまでを表示"].forEach(h=>line("  "+h,"dim"));
      gap();return;
    }
    if(c==="done"){gap();done();return}
    if(c==="clear"){lines=[];gap();line("全部消しました。白紙です。どうぞ。","a");gap();return}
    if(c==="reset"||c==="redo"){gap();startWrite(false);return}
    if(c==="undo"){const g=lines.pop();gap();line(g?"1行消しました：「"+g+"」":"消す行がありません","dim");gap();return}
    if(c==="preview"){gap();preview();return}
    gap();line("そんなコマンドはありません。/help をどうぞ。","err");gap();return;
  }

  if(stage==="pick"){
    line(v,"u");
    const n=parseInt(v.trim(),10);
    const hit=ROSTER[n-1]||ROSTER.find(r=>r.who.replace(/\s/g,"")===v.trim().replace(/\s/g,""))
           ||ROSTER.find(r=>v.trim().includes(r.who)||r.who.includes(v.trim()));
    gap();
    if(!hit){line("見つかりませんでした。1〜"+ROSTER.length+"の番号でどうぞ。","err");gap();return}
    who=hit; startWrite(false); return;
  }

  if(stage==="write"){
    if(!v.trim()){lines.push("");line(" ","dim");return}
    lines.push(v);
    line(v,"u");
    return;
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=input.value;input.value="";
    input.style.height="auto";submit(v)}
});
input.addEventListener("input",()=>{input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,120)+"px"});
input.focus();
document.addEventListener("click",()=>input.focus());
</script>
</body>
</html>
