<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>congrats — 中村駿吾さん ご栄転</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@300;400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15141B; --panel:#1C1B24; --line:#332F3E;
  --amber:#E8A33D; --amber-dim:#8A6528;
  --text:#DBD5C7; --muted:#7E7789;
  --user:#8FA6D8; --ok:#7FB88A; --seal:#C0453B;
  --mono:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace;
  --mincho:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;height:100dvh}
body{
  background:var(--bg);color:var(--text);font-family:var(--mono);font-weight:300;
  font-size:13.5px;line-height:1.85;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.013) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}

#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 22px 8px;overscroll-behavior:contain}
#scroll::-webkit-scrollbar{width:8px}
#scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.inner{max-width:920px;margin:0 auto}

/* ウェルカムボックス */
.wbox{position:relative;border:1px solid var(--amber-dim);border-radius:7px;
  display:grid;grid-template-columns:0.92fr 1.08fr;margin:12px 0 24px}
.wbox .legend{position:absolute;top:-.72em;left:18px;background:var(--bg);padding:0 9px;
  color:var(--amber);font-size:11.5px;font-weight:500;letter-spacing:.09em}
.wl{padding:22px 20px 20px;text-align:center;border-right:1px solid var(--amber-dim)}
.wr{padding:22px 22px 20px}
.hey{font-size:13.5px;font-weight:400;color:#E4DED0;letter-spacing:.02em}
.hey b{font-family:var(--mincho);font-weight:900;font-size:23px;letter-spacing:.06em;
  color:#F7F1E4;text-shadow:0 0 26px rgba(232,163,61,.32);vertical-align:-1px}
.port{margin:16px auto 14px;width:176px;max-width:100%}
.port img{display:block;width:100%;height:auto;image-rendering:pixelated;
  border:1px solid var(--line);border-radius:2px}
.port figcaption{margin-top:7px;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.wl .meta{color:var(--muted);font-size:11.5px;line-height:1.8}
.wl .meta em{font-style:normal;color:var(--amber-dim)}
.wr h4{color:var(--amber);font-size:12.5px;font-weight:700;letter-spacing:.03em;margin-bottom:3px}
.wr p{color:var(--text);font-size:12.5px;line-height:1.72;opacity:.9}
.wr p code{color:var(--amber);font-weight:500;font-family:var(--mono)}
.wr hr{border:0;border-top:1px solid var(--amber-dim);margin:13px 0}
.wr .it{font-style:italic;color:var(--muted);font-size:12px}
@media (max-width:720px){
  .wbox{grid-template-columns:1fr}
  .wl{border-right:0;border-bottom:1px solid var(--amber-dim)}
}

/* 行 */
.row{margin:0 0 4px;white-space:pre-wrap;word-break:break-word}
.gap{height:14px}
.u{color:var(--user)}
.u::before{content:"> ";color:var(--muted)}
.a{padding-left:0}
.a::before{content:"⏺ ";color:var(--amber)}
.tool{color:var(--muted);font-size:12.5px}
.tool::before{content:"⏺ ";color:var(--ok)}
.res{color:var(--muted);font-size:12.5px;padding-left:2px}
.res::before{content:"  ⎿  "}
.dim{color:var(--muted)}
.err{color:var(--seal)}
.hi{color:var(--amber)}
.msgbody{border-left:2px solid var(--amber-dim);padding:2px 0 2px 16px;margin:8px 0 4px 2px;line-height:2.05}
.think{color:var(--amber)}
.msgbody .ln{display:block;min-height:1.1em;opacity:0;animation:fi .5s ease forwards}
@keyframes fi{to{opacity:1}}

/* 一覧のタップ行 */
.pick{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:13px;font-weight:300;color:var(--text);
  padding:7px 12px;border-radius:3px;border-left:2px solid transparent;line-height:1.6;
  transition:background .15s,border-left-color .15s}
.pick:hover{background:var(--panel);border-left-color:var(--amber)}
.pick .no{color:var(--muted);margin-right:12px}
.pick .ck{color:var(--ok);margin-left:10px;font-size:11.5px}
.pick .yet{color:var(--amber-dim);margin-left:10px;font-size:11.5px}

/* 締め */
.fin{border:1px solid var(--amber-dim);border-radius:7px;padding:26px 22px 22px;text-align:center;margin:6px 0 8px}
.fin .k{font-family:var(--mincho);font-weight:900;font-size:30px;color:var(--seal);
  border:2px solid var(--seal);display:inline-block;padding:8px 12px;line-height:1;margin-bottom:16px}
.fin .t{font-family:var(--mincho);font-weight:900;font-size:18px;color:#F2ECE0;letter-spacing:.08em}
.fin .s{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.9}
.prof{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:18px 20px;margin:8px 0 4px}
.prof .ph{color:var(--amber);font-size:11.5px;letter-spacing:.09em;margin-bottom:12px}
.prof .pl{display:flex;gap:12px;margin:0 0 9px;font-size:13px;line-height:1.85}
.prof .pl:last-child{margin-bottom:0}
.prof .pl .b{color:var(--amber-dim);flex:0 0 auto}

/* 入力 */
#dock{border-top:1px solid var(--line);background:var(--bg);padding:14px 22px 12px}
.dockin{max-width:920px;margin:0 auto}
.box{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 13px}
.box:focus-within{border-color:var(--amber-dim)}
.box .cr{color:var(--amber)}
#in{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--mono);
  font-size:13.5px;font-weight:300;resize:none;line-height:1.7;max-height:120px}
#in::placeholder{color:#55505F}
.hint{display:flex;justify-content:space-between;font-size:11px;color:#55505F;margin-top:7px}
#top{position:fixed;right:18px;bottom:104px;z-index:120;display:none;
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--amber);
  font-family:var(--mono);font-size:15px;line-height:1}
#top.on{display:block}
#top:hover{border-color:var(--amber-dim)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:none;border:1px solid var(--line);color:var(--text);font-family:var(--mono);
  font-size:12px;font-weight:300;padding:7px 14px;border-radius:14px;cursor:pointer;
  transition:border-color .18s,color .18s,background .18s}
.chip:hover{border-color:var(--amber-dim);color:var(--amber)}
.chip.key{border-color:var(--amber-dim);color:var(--amber)}
.chip.key:hover{background:var(--amber);color:var(--bg)}
#status .on{color:var(--ok)}
#status .off{color:var(--amber-dim)}

/* 上映モード */
#show{position:fixed;inset:0;z-index:180;background:rgba(12,11,17,.985);display:none;
  flex-direction:column;justify-content:center;align-items:center;padding:64px 24px 96px;text-align:center}
#show.on{display:flex}
#show .who{font-size:13px;color:var(--amber);letter-spacing:.18em;margin-bottom:38px}
#show .body{font-family:var(--mincho);font-weight:700;font-size:clamp(17px,3.3vw,31px);
  line-height:2.05;max-width:780px;white-space:pre-wrap;color:#F2ECE0;
  max-height:calc(100dvh - 210px);overflow-y:auto;padding:0 2px}
#show .nav{position:fixed;bottom:26px;font-size:11.5px;color:var(--muted);display:flex;gap:20px;align-items:center}
#show .nav button{background:none;border:1px solid var(--line);color:var(--amber);font-family:var(--mono);
  font-size:15px;padding:6px 16px;border-radius:3px;cursor:pointer}
#show .nav button:hover{border-color:var(--amber-dim)}
#xshow{position:fixed;top:20px;right:22px;background:none;border:1px solid var(--line);
  color:var(--muted);font-family:var(--mono);font-size:12px;padding:7px 14px;border-radius:3px;cursor:pointer}
#xshow:hover{color:var(--amber);border-color:var(--amber-dim)}
#show .body::-webkit-scrollbar{width:6px}
#show .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--amber);width:0}

@media (max-width:640px){
  body{font-size:13px;line-height:1.8}
  #scroll{padding:18px 14px 6px}
  #dock{padding:10px 14px 10px}
  .wl{padding:18px 16px 16px}
  .wr{padding:18px 16px 16px}
  .hey b{font-size:21px}
  .port{width:150px}
  .wl .meta{font-size:11px}
  .wr p,.wr h4{font-size:12px}
  /* コマンドボタンは折り返さず横スクロール */
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:9px;
    padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:10px 16px;font-size:12.5px}
  /* iOSで拡大されないよう16px */
  #in{font-size:16px}
  .box{padding:9px 12px}
  .hint{font-size:10.5px}
  .pick{padding:12px 10px;font-size:13px}
  .pick .no{margin-right:10px}
  .msgbody{padding-left:13px;line-height:2.0}
  #show{padding:56px 18px 100px}
  #show .who{margin-bottom:22px}
  #show .body{line-height:1.95;max-height:calc(100dvh - 200px)}
  #show .nav{bottom:20px;gap:14px}
  #show .nav button{font-size:18px;padding:11px 26px}
  #xshow{top:14px;right:14px;padding:9px 14px}
  .fin{padding:22px 16px 18px}
  .fin .k{font-size:26px}
  .fin .t{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.msgbody .ln{opacity:1}}
</style>
</head>
<body>

<div id="scroll"><div class="inner" id="log"></div></div>
<button id="top" title="上へ">↑</button>

<div id="dock"><div class="dockin">
  <div class="chips" id="chips"></div>
  <div class="box"><span class="cr">&gt;</span><textarea id="in" rows="1" placeholder="下のボタンを押すか、コマンドを入力"></textarea></div>
  <div class="hint"><span id="status"></span><span>Enter 送信 · Shift+Enter 改行</span></div>
</div></div>

<div id="show">
  <div id="bar"></div>
  <button id="xshow">閉じる</button>
  <div class="who" id="sWho"></div>
  <div class="body" id="sBody"></div>
  <div class="nav">
    <button id="sPrev">←</button><span id="pos"></span><button id="sNext">→</button>
  </div>
</div>

/* ---------- 状態 ---------- */
const read=new Set();
let finished=false;

function updStatus(){
  const left=DATA.messages.length-read.size;
  $("#status").innerHTML = left>0
    ? '<span class="dim">まだ読んでいない手紙が </span><span class="hi">'+left+'</span><span class="dim"> 通あります</span>'
    : '<span class="dim">'+DATA.messages.length+'通、ぜんぶ読み終わりました</span>';
}

const CHIPS=[
  {l:"みんなの一覧",c:"/messages",key:true},
  {l:"ぜんぶ読む",c:"/all"},
  {l:"1通ずつ大きく",c:"/show"},
  {l:"プロフィール",c:"/about"},
  {l:"ヘルプ",c:"/help"},
  {l:"↑ ホーム",c:"/home"},
];
function renderChips(){
  const box=$("#chips"); box.innerHTML="";
  CHIPS.forEach(x=>{
    const b=document.createElement("button");
    b.className="chip"+(x.key?" key":""); b.textContent=x.l;
    b.onclick=()=>submit(x.c);
    box.appendChild(b);
  });
}
renderChips(); updStatus();

$("#top").onclick=()=>scroll.scrollTo({top:0,behavior:"smooth"});
scroll.addEventListener("scroll",()=>{
  $("#top").classList.toggle("on", scroll.scrollTop>420);
},{passive:true});

/* ---------- コマンド ---------- */
const HELP=[
  "/messages          預かっている手紙の一覧",
  "/all               ぜんぶ通しで読む",
  "/show              1通ずつ大きく表示（スワイプで移動）",
  "/show auto         9秒ずつ自動でめくる",
  "/about             "+DATA.name+"さんについて残っている記録",
  "/home              最初の画面に戻る（/clear も同じ）",
  "名前を入力         その人の手紙が開きます（一覧をタップしても同じです）",
];

function cmdMessages(){
  line('Glob(messages/*.md)',"tool");
  line("Found "+DATA.messages.length+" files","res");
  gap();
  const wrap=document.createElement("div");
  DATA.messages.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="pick";
    b.innerHTML='<span class="no">'+String(i+1).padStart(2,"0")+'</span>'+esc(m.who)+
      (read.has(m.id)?'<span class="ck">✓ 読みました</span>':'<span class="yet">未読</span>');
    b.onclick=()=>submit(m.who);
    wrap.appendChild(b);
  });
  log.appendChild(wrap); scroll.scrollTop=scroll.scrollHeight;
  gap();
  line("押すとその手紙が開きます。","dim");
  gap();
}
function findMsg(q){
  q=(q||"").trim();
  if(!q) return null;
  return DATA.messages.find(m=>m.id===q||m.who===q||m.who.replace(/\s/g,"")===q.replace(/\s/g,""))
      || DATA.messages.find(m=>m.who.includes(q)||q.includes(m.who.split(" ")[0]));
}
function bodyHTML(t){
  return t.split("\n").map((l,i)=>
    '<span class="ln" style="animation-delay:'+Math.min(i*90,900)+'ms">'+(l?esc(l):"&nbsp;")+'</span>'
  ).join("");
}
function cmdRead(q){
  const m=findMsg(q);
  if(!m){
    line("その名前は見つかりませんでした。","a");
    line("一覧から選んでください。","dim"); gap(); cmdMessages(); return;
  }
  line("Read(messages/"+m.id+".md)","tool");
  line("Read "+m.body.split("\n").length+" lines","res");
  html('<div class="row hi" style="margin-top:10px">'+esc(m.who)+'</div>'+
       '<div class="msgbody">'+bodyHTML(m.body)+'</div>');
  gap();
  read.add(m.id); updStatus(); checkFinish();
}
function cmdAll(){
  line("Read(messages/*.md)","tool");
  line("Read "+DATA.messages.length+" files","res");
  gap();
  DATA.messages.forEach(m=>{
    html('<div class="row hi">'+esc(m.who)+'</div>'+
         '<div class="msgbody">'+bodyHTML(m.body)+'</div>');
    gap();
    read.add(m.id);
  });
  updStatus(); checkFinish();
}
let aboutSeen=false;
function cmdAbout(){
  aboutSeen=true;
  line("Read(profile.md)","tool");
  line("Read "+DATA.facts.length+" lines","res");
  gap();
  html('<div class="prof"><div class="ph">profile.md</div>'+
    DATA.facts.map(f=>'<div class="pl"><span class="b">·</span><span>'+esc(f)+'</span></div>').join("")+
  '</div>');
  gap();
  line("みんなが見ていた中村さんです。","dim");
  gap();
}
function checkFinish(){
  if(finished || read.size<DATA.messages.length) return;
  finished=true;
  setTimeout(()=>{
    line("これで全部です。","a");
    gap();
    html('<div class="fin">'+
      '<div class="k">'+esc(DATA.seal)+'</div>'+
      '<div class="t">ご栄転、おめでとうございます</div>'+
      '<div class="s">'+esc(DATA.org)+' 有志一同<br>'+
      DATA.messages.map(m=>esc(m.who)).join(' ／ ')+'</div>'+
    '</div>');
    gap();
    line("いつでもこのURLから読み返せます。","dim");
    gap();
    if(!aboutSeen){
      line("そういえば、みんなが書いた中村さんの記録も残っています。","dim");
      const b=document.createElement("button");
      b.className="pick"; b.style.marginTop="6px";
      b.innerHTML='<span class="no">→</span>profile.md を開く';
      b.onclick=()=>submit("/about");
      log.appendChild(b); scroll.scrollTop=scroll.scrollHeight;
      gap();
    }
  },600);
}

/* ---------- 1通ずつ表示 ---------- */
let idx=0,timer=null,auto=false;const DUR=9000;
function paint(){
  const m=DATA.messages[idx];
  $("#sWho").textContent=m.who;
  $("#sBody").textContent=m.body;
  $("#pos").textContent=(idx+1)+" / "+DATA.messages.length;
  $("#sBody").scrollTop=0;
  read.add(m.id); updStatus();
  const b=$("#bar");
  b.style.transition="none"; b.style.width="0";
  if(auto) requestAnimationFrame(()=>{b.style.transition="width "+DUR+"ms linear";b.style.width="100%"});
}
function step(n){
  const last=idx===DATA.messages.length-1;
  if(n>0 && last){ closeShow(); return; }
  idx=(idx+n+DATA.messages.length)%DATA.messages.length;
  paint();
  if(auto){clearInterval(timer);timer=setInterval(()=>step(1),DUR)}
}
function openShow(a){
  auto=!!a; idx=0; $("#show").classList.add("on"); paint();
  if(auto) timer=setInterval(()=>step(1),DUR);
}
function closeShow(){
  $("#show").classList.remove("on"); clearInterval(timer);
  checkFinish(); input.focus();
}
$("#xshow").onclick=closeShow;
$("#sPrev").onclick=()=>step(-1);
$("#sNext").onclick=()=>step(1);
// スワイプで前後（縦スクロールとは干渉させない）
(function(){
  const el=$("#show"); let x0=null,y0=null;
  el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    x0=null;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) step(dx<0?1:-1);
  },{passive:true});
})();

document.addEventListener("keydown",e=>{
  if(!$("#show").classList.contains("on"))return;
  if(e.key==="Escape")closeShow();
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();step(1)}
  if(e.key==="ArrowLeft")step(-1);
});

/* ---------- 入力 ---------- */
function submit(raw){
  const q=raw.trim(); if(!q)return;
  line(q,"u"); gap();
  if(q.startsWith("/")){
    const [c,...rest]=q.slice(1).split(/\s+/);
    const arg=rest.join(" ");
    if(c==="help"){HELP.forEach(h=>line("  "+h,"dim"));gap();}
    else if(c==="messages"||c==="ls")cmdMessages();
    else if(c==="read"||c==="cat")cmdRead(arg);
    else if(c==="all")cmdAll();
    else if(c==="about")cmdAbout();
    else if(c==="show"||c==="play"){
      const a=/auto|自動/.test(arg);
      line(a?"9秒ずつ自動でめくります。閉じるボタンで戻れます。"
            :"1通ずつ大きく表示します。左右スワイプか ← → で進みます。","a");
      gap(); openShow(a);
    }
    else if(c==="home"||c==="clear"){log.innerHTML=""; renderHome();}
    else {
      line("そのコマンドは用意していません。","a");
      line("下のボタンからも選べます。/help で一覧が出ます。","dim"); gap();
    }
    return;
  }
  const m=findMsg(q);
  if(m){ cmdRead(m.id); return; }
  line("うまくお返事はできませんが、その言葉はきっと5人に届いています。","a");
  line("下のボタンか、読みたい人の名前を入力してください。","dim");
  gap();
}
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=input.value;input.value="";input.style.height="auto";submit(v)}
});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px"});
input.focus();
document.addEventListener("click",e=>{
  if($("#show").classList.contains("on"))return;
  if(e.target.closest("#dock")||e.target.closest(".pick"))return;
  if(window.innerWidth>720) input.focus();
});
</script>
</body>
